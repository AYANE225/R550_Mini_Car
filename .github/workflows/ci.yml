name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy open3d matplotlib pytest pybind11
      - name: Build C++ ICP extension
        run: |
          sudo apt-get update && sudo apt-get install -y libeigen3-dev libgl1 libegl1 libgomp1
          PY=python bash native/build.sh
      - name: Run tests
        run: pytest tests/ -q
